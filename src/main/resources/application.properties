spring.application.name=spotify-recommender
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:spotify_recommender}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spotify.client-id=${SPOTIFY_CLIENT_ID}
spotify.client-secret=${SPOTIFY_CLIENT_SECRET}
spotify.redirect-uri=${SPOTIFY_REDIRECT_URI:http://127.0.0.1:8080/auth/spotify/callback}

app.security.token-encryption-key=${TOKEN_ENCRYPTION_KEY}
app.security.cookie-secure=${COOKIE_SECURE:false}

lastfm.api-key=${LASTFM_API_KEY}

recommendation.min-match-score=0.1
recommendation.re-recommend-cooldown=24h