spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spotify.client-id=test-client-id
spotify.client-secret=test-client-secret
spotify.redirect-uri=http://127.0.0.1:8080/auth/spotify/callback

# 32 zero bytes, base64 — AES-256 test key, never used outside tests
app.security.token-encryption-key=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
app.security.cookie-secure=false

lastfm.api-key=test-lastfm-key

recommendation.min-match-score=0.1
recommendation.re-recommend-cooldown=24h

app.scheduling.enabled=false
